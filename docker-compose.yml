services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackzy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackzy}
      POSTGRES_DB: trackzy
    volumes:
      - trackzy-pg:/var/lib/postgresql/data
    restart: unless-stopped

  trackzy:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://trackzy:${POSTGRES_PASSWORD:-trackzy}@db:5432/trackzy
      PUBLIC_BASE_URL: https://trackzy.in
      TAWK_PROPERTY_ID: ${TAWK_PROPERTY_ID:-6ac41539618b6434c2779672}
      TAWK_WIDGET_ID: ${TAWK_WIDGET_ID:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  chatwoot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      POSTGRES_DB: chatwoot
    volumes:
      - chatwoot-pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  chatwoot:
    image: chatwoot/chatwoot:latest
    depends_on:
      - chatwoot-db
      - redis
    environment: &chatwoot-env
      RAILS_ENV: production
      NODE_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET:-replace-with-a-long-random-string}
      FRONTEND_URL: ${CHATWOOT_BASE_URL:-https://support.trackzy.in}
      POSTGRES_HOST: chatwoot-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    depends_on:
      - chatwoot-db
      - redis
    environment: *chatwoot-env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

volumes:
  trackzy-pg:
  chatwoot-pg:
